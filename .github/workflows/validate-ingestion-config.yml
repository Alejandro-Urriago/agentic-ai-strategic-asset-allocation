name: Validate ingestion config

on:
  pull_request:
    paths:
      - "ingestion/**"
  push:
    branches: [main]
    paths:
      - "ingestion/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate source configs
        run: python ingestion/jobs/update_control_table.py --config-dir ingestion/config/sources --validate-only
      - name: Compile Python
        run: python -m py_compile ingestion/jobs/update_control_table.py ingestion/transformations/bronze_ingest.py

# How dbt connects to Databricks.
# No personal values here: they are read from dbt/.env (not on GitHub).
# See dbt/.env.example for the values to fill in.
# Sign-in is through the browser (OAuth); no password or token is stored.
agentic_ai_asset_allocation_project:
  target: dev
  outputs:
    dev:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      catalog: "{{ env_var('DBT_CATALOG') }}"
      schema: "{{ env_var('DBT_SCHEMA') }}"
      auth_type: oauth
      threads: 4
version: 2

# Bronze tables: raw copies of the 4 modelled CSV files, loaded by the
# Databricks bronze_pipeline. dbt reads them here and builds silver and gold.
sources:
  - name: bronze
    schema: bronze
    description: Raw data loaded by the Databricks bronze pipeline. All business columns are text.
    config:
      loaded_at_field: _ingested_at   # when each row was loaded
      freshness:                      # APRA data is quarterly
        warn_after: {count: 100, period: day}
        error_after: {count: 130, period: day}
    tables:
      - name: bronze_dim_fund
        description: One row per superannuation fund.
        columns:
          - name: fund_key
            data_tests: [not_null]
      - name: bronze_dim_investment_option
        description: One row per investment option (the largest option per fund and risk profile).
        columns:
          - name: investment_option_key
            data_tests: [not_null]
      - name: bronze_dim_asset_class
        description: One row per asset class.
        columns:
          - name: asset_class_key
            data_tests: [not_null]
      - name: bronze_fact_investment_strategic_allocation
        description: Strategic asset allocation targets (not actual holdings), per option, asset class and date.
        columns:
          - name: investment_option_key
            data_tests: [not_null]